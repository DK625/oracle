project:
  name: oracle
  description: Durable engineering memory for the Oracle CLI and browser bridge
  version: 0.15.1-dev

entrypoints:
  human: my_build/INDEX.md
  agent: my_build/INDEX.md

knowledge_policy:
  durable_only: true
  avoid_raw_logs: true
  avoid_scratch_files: true
  archive_deprecated_context: true

active_files:
  product:
    - my_build/product/vision.md
    - my_build/product/roadmap.md
    - my_build/product/user-flows.md
  architecture:
    - my_build/architecture/overview.md
    - my_build/architecture/service-map.md
    - my_build/architecture/data-flow.md
    - my_build/architecture/integrations.md
  features:
    - my_build/features/bridge-artifact-transfer.md
    - my_build/features/bridge-concurrent-runs.md
  bugs:
    - my_build/bugs/2026-06-28-chatgpt-sandbox-artifact-capture-gap.md
  decisions:
    - my_build/decisions/ADR-0002-bridge-artifact-transfer-protocol.md
  specs:
    - my_build/specs/api-contracts.md
    - my_build/specs/event-contracts.md
  debug:
    - my_build/debug/quick-debug.md
  notes:
    - my_build/notes/gotchas.md
  handoffs:
    - my_build/handoffs/agent-context.md
    - my_build/handoffs/human-context.md
    - my_build/handoffs/local-bridge-concurrency-rollout.md
    - my_build/handoffs/release-handoff.md

task_routes:
  feature:
    - my_build/product/vision.md
    - my_build/architecture/overview.md
    - my_build/features/
    - my_build/specs/
  bug:
    - my_build/debug/quick-debug.md
    - my_build/bugs/
    - my_build/notes/gotchas.md
  decision:
    - my_build/architecture/overview.md
    - my_build/decisions/
  debug:
    - my_build/debug/
    - my_build/notes/gotchas.md

validation:
  max_index_lines: 180
  require_active_files_exist: true
  forbid_tmp_files: true
  forbid_broken_markdown_links: true
